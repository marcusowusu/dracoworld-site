services:
  - type: web
    name: dracoworld-api
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "false"
      - key: DATABASE_SSL
        value: "true"
      - key: SESSION_TTL_HOURS
        value: "168"
      - key: DB_POOL_MAX
        value: "10"
      - key: PUBLIC_ORIGIN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: RATE_LIMIT_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
