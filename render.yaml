services:
  - type: web
    name: dracoworld-api
    runtime: node
    plan: starter
    buildCommand: npm ci
    preDeployCommand: npm run migrate
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "false"
      - key: DATABASE_SSL
        value: "true"
      - key: SESSION_TTL_HOURS
        value: "168"
      - key: DB_POOL_MAX
        value: "10"
      - key: PUBLIC_ORIGIN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: RATE_LIMIT_SECRET
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
